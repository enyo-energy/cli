                        outcomePicker(input.outcomes),
                    ]));
                    break;
                case 'input':
                    parts.push(section('Simulated device check · ' + input.valueType, [
                        note('The device test cannot run here. Pick its verdict; the preview\'s button submits the typed value with it.'),
                        outcomePicker(input.outcomes, [{id: '__unreachable', label: 'Request fails (no device reachable)', value: ''}]),
                    ]));
                    break;
                case 'auth':
                    parts.push(section('Simulated login', [
                        el('label', {class: 'row', style: 'font-size:12px'}, [
                            el('input', {type: 'checkbox', checked: ui.authConfirms, onchange: event => setUi({authConfirms: event.target.checked})}),
                            'The host confirms the login on „Weiter"',
                        ]),
                        ui.loginOpened ? note('„Jetzt anmelden" would open the energy app\'s sign-in page now.') : null,
                        input.requiresWebAuthentication
                            ? note('Web-only login: in the native app the step first shows „Weiter in der Web-Version" with a „Zur Web-Version wechseln" button.', 'warn')
                            : null,
                    ]));
                    break;
                case 'additional-setup': {
                    const resolution = view.setups[input.blockId];
                    parts.push(section('Setup · ' + input.setupKey, [
                        note('The fields go to your additional-setup handler; its verdict picks the branch.'),
                        resolution ? el('div', {}, [
                            el('span', {class: 'badge ' + (resolution.fellBackToFailed ? 'err' : 'ok'), text: 'last verdict: ' + (resolution.rawOutcome || 'failed')}),
                            resolution.note ? note(resolution.note) : null,
                            resolution.detail ? el('div', {class: 'mono', text: resolution.detail}) : null,
                        ]) : null,
                    ]));
                    break;
                }
                case 'picker': {
                    const picker = (view.pickers || {})[input.blockId] || {candidates: []};
                    const filter = input.picker === 'eebus-device-select'
                        ? (input.deviceTypes ? 'deviceTypes: ' + input.deviceTypes.join(', ') : 'every peer')
                        : (input.detectedAt ? 'detectedAt: ' + input.detectedAt.join(', ') : 'every device');
                    const resolution = picker.resolution;
                    parts.push(section('Picker · ' + input.picker, [
                        note(`${picker.candidates.length} simulated candidate(s) · ${filter}`),
                        picker.preselectedKey
                            ? note('One candidate matches, so the app highlights it — the installer still confirms it, and the handler hears autoSelected: true.')
                            : null,
                        picker.candidates.length === 0 ? note('Nothing matches: „Mein Gerät ist nicht dabei" is the way out.', 'warn') : null,
                        resolution ? el('div', {}, [
                            el('span', {class: 'badge ok', text: (resolution.autoSelected ? 'confirmed ' : 'picked ') + resolution.label}),
                            el('span', {
                                class: 'badge ' + (resolution.applianceIds.length ? 'ok' : 'warn'),
                                text: resolution.applianceIds.length ? 'appliance(s): ' + resolution.applianceIds.join(', ') : 'no appliance',
                            }),
                            resolution.note ? note(resolution.note) : null,
                        ]) : null,
                    ]));
                    break;
                }
                default:
                    break;
            }

            const dynamicBlocks = model.step.blocks.filter(block => block.type === 'dynamic');
            if (dynamicBlocks.length) {
                parts.push(section('Dynamic values', dynamicBlocks.map(block => {
                    const resolution = view.dynamic[block.id] || {};
                    return el('div', {style: 'margin-bottom:6px'}, [
                        el('span', {class: 'badge', text: block.kind}),
                        el('span', {
                            class: 'badge ' + (resolution.source === 'app' ? 'ok' : resolution.source === 'host' ? '' : 'warn'),
                            text: resolution.source === 'host' ? 'resolved by the host' : (resolution.source || 'pending'),
                        }),
                        resolution.note ? note(resolution.note) : null,
                        resolution.errors ? note(resolution.errors.join('\n'), 'err') : null,
                    ]);
                })));
            }

            const selects = model.step.blocks.filter(block => block.type === 'select');
            if (selects.length) {
                parts.push(section('Selects', [note('A select records its answer with the step on a device; the simulator does not keep it.')]));
            }
        }

        if (model.isTerminal) {
            const terminal = model.terminal || {};
            const labels = {
                success: 'Success — the app moves on to the found screen (or the settings, for device-found-config).',
                support: 'Handed to support' + (terminal.reason ? ` (${terminal.reason})` : '') + '.',
                pause: 'Paused — ' + terminal.reason + (terminal.resumeStepName ? `, resumes at ${terminal.resumeStepName}` : '') + '.',
                'start-variant': `Hand-off to the ${terminal.variant} variant — the app ships no guide for it, so the run goes to support.`,
            };
            parts.push(section('Exit', [
                el('div', {class: 'terminal-box ' + terminal.type}, [
                    el('div', {text: labels[terminal.type] || terminal.type}),
                    el('div', {class: 'muted', style: 'margin-top:6px', text: 'Walked: ' + view.visited.join(' → ')}),
                ]),
                el('div', {class: 'row', style: 'margin-top:10px'}, el('button', {class: 'tool', onclick: () => resetRun(view)}, 'Walk it again')),
            ]));
        }

        document.getElementById('inspector-body').replaceChildren(...parts);
    };

    // ---- stage ------------------------------------------------------------
    const startRun = async (guideIndex, context) => {
        state.handedOffFrom = null;
        state.ui = null;
        try {
            showView(await api('/api/runs', {method: 'POST', body: JSON.stringify({guideIndex, context})}));
        } catch (error) {
            fail(error);
        }
    };

    const resetRun = view => api(`/api/runs/${view.runId}/reset`, {method: 'POST'}).then(view => {
        state.ui = null;
        showView(view);
    }).catch(fail);

    const showView = view => {
        const previous = state.view;
        state.view = view;
        state.ui = uiFor(view);

        // The API follows a start-variant exit into the next guide by itself,
        // so the app never shows that exit when a guide for it exists.
        const terminal = view.renderModel.terminal;
        if (view.renderModel.isTerminal && terminal && terminal.type === 'start-variant' && view.handoffGuideIndex >= 0) {
            const from = view.guide.name;
            startRun(view.handoffGuideIndex).then(() => {
                state.handedOffFrom = from;
                rerender();
            });
            return;
        }

        const stage = document.getElementById('stage');
        stage.replaceChildren(renderPreview(view));
        renderInspector(view);
        renderRunInfo(view);
        if (!previous || previous.guide.index !== view.guide.index) renderLibrary();
    };

    const renderRunInfo = view => {
        document.getElementById('run-info').replaceChildren(
            el('div', {class: 'mono', text: view.guide.name + ' · ' + view.context.variant}),
            el('div', {style: 'margin-top:8px;display:flex;flex-direction:column;gap:4px'},
                view.events.slice().reverse().map(event => el('div', {class: 'muted mono', text: event.message}))),
        );
    };

    // ---- basket: screens collected for the PDF -------------------------------
    const BASKET_KEY = 'enyo.sim.basket.v2';
    const loadBasket = () => {
        try {
            return JSON.parse(sessionStorage.getItem(BASKET_KEY) || '[]');
        } catch {
            return [];
        }
    };
    const saveBasket = () => {
        try {
            sessionStorage.setItem(BASKET_KEY, JSON.stringify(state.basket));
        } catch {
            // Storage off or full: the basket still lives as long as the page does.
        }
    };

    /**
     * What the step on screen says, as markup: its content only. The phone frame,
     * the top bar (back, progress, support), the footer buttons and everything
     * the installer fills in or taps — inputs, choices, pickers, copy and zoom
     * buttons — are left out, as is the full-screen image viewer.
     */
    const SNAPSHOT_STRIP = [
        '.app-topbar', '.app-footer', '.step-input', '.viewer',
        'input', 'textarea', 'select', '.a-select-wrap', '.running', '.spinner',
        'button.a-btn', 'button.text-link', '.icon-btn', '.image-block .zoom',
    ].join(', ');
    const snapshotDevice = () => {
        const device = document.querySelector('#stage .device');
        if (!device) return null;
        const copy = device.cloneNode(true);
        copy.querySelectorAll(SNAPSHOT_STRIP).forEach(node => node.remove());
        copy.className = 'print-screen';
        copy.removeAttribute('style');
        return copy.outerHTML;
    };

    const TERMINAL_TITLES = {success: 'Success', support: 'Handed to support', pause: 'Paused', 'start-variant': 'Hand-off'};

    const addToBasket = view => {
        const html = snapshotDevice();
        if (!html) return;
        const model = view.renderModel;
        const terminal = model.isTerminal ? (model.terminal || {}) : null;
        state.basket.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            html,
            packageName: state.app ? state.app.packageName : '',
            guideName: view.guide.name,
            guideTitle: t(view.guide.title) || view.guide.name,
            variant: view.context.variant,
            stepName: model.step ? model.step.name : 'exit: ' + (terminal && terminal.type),
            stepTitle: model.step ? t(model.step.title) : TERMINAL_TITLES[terminal && terminal.type] || '',
            language: state.language,
            note: '',
            at: new Date().toISOString(),
        });
        saveBasket();
        renderBasket();
    };

    const changeBasket = mutate => {
        mutate(state.basket);
        saveBasket();
        renderBasket();
    };
    const moveInBasket = (index, delta) => changeBasket(basket => {
        const target = index + delta;
        if (target < 0 || target >= basket.length) return;
        basket.splice(target, 0, ...basket.splice(index, 1));
    });

    /** A stored screen, put back as inert markup — nothing in it reacts to clicks. */
    const frozen = (html, className) => {
        const box = el('div', {class: className, inert: true});
        box.innerHTML = html;
        return box;
    };

    const renderBasket = () => {
        const basket = state.basket;
        const items = basket.map((entry, index) => el('div', {class: 'basket-item'}, [
            frozen(entry.html, 'basket-thumb'),
            el('div', {class: 'basket-body'}, [
                el('div', {class: 'title', text: `${index + 1}. ${entry.stepTitle || entry.stepName}`}),
                el('div', {class: 'mono muted truncate', title: `${entry.guideName} · ${entry.stepName}`, text: `${entry.guideName} · ${entry.stepName}`}),
                el('textarea', {
                    placeholder: 'Note for this page (optional)',
                    text: entry.note,
                    oninput: event => {
                        entry.note = event.target.value;
                        saveBasket();
                    },
                }),
                el('div', {class: 'row'}, [
                    el('button', {class: 'tool', title: 'Move up', disabled: index === 0, onclick: () => moveInBasket(index, -1)}, '↑'),
                    el('button', {class: 'tool', title: 'Move down', disabled: index === basket.length - 1, onclick: () => moveInBasket(index, 1)}, '↓'),
                    el('button', {class: 'tool', onclick: () => changeBasket(list => list.splice(index, 1))}, 'Remove'),
                ]),
            ]),
        ]));
        document.getElementById('basket').replaceChildren(
            ...(items.length
                ? items
                : [el('div', {class: 'muted', text: '„Add to basket" in the Simulator panel keeps the screen as it looks now. Print the basket as an A4 PDF, one screen per page.'})]),
            el('div', {class: 'row', style: 'margin-top:10px'}, [
                el('button', {class: 'tool dark', disabled: !basket.length, onclick: () => printBasket().catch(fail)},
                    `Print PDF (${basket.length} ${basket.length === 1 ? 'page' : 'pages'})`),
                el('button', {class: 'tool', disabled: !basket.length, onclick: () => changeBasket(list => list.splice(0))}, 'Clear'),
            ]),
        );
    };

    /**
     * Lay the basket out as A4 pages and hand them to the browser's print
     * dialog — "Save as PDF" there is the export. The pages are measured first,
     * so a step taller than its page is zoomed down to fit rather than cut off.
     */
    const printBasket = async () => {
        const root = document.getElementById('print-root');
        const total = state.basket.length;
        const printedAt = new Date().toLocaleString();
        root.replaceChildren(...state.basket.map((entry, index) => el('section', {class: 'print-page'}, [
            el('div', {class: 'print-head'}, [
                el('div', {class: 'print-main'}, [
                    el('div', {class: 'print-kicker', text: [entry.packageName, entry.variant].filter(Boolean).join(' · ')}),
                    el('div', {class: 'print-guide', text: entry.guideTitle}),
                    el('div', {class: 'print-step', text: entry.stepTitle || entry.stepName}),
                ]),
                el('div', {class: 'print-count'}, [el('strong', {text: String(index + 1)}), `of ${total}`]),
            ]),
            frozen(entry.html, 'print-slot'),
            entry.note.trim() ? el('div', {class: 'print-note', text: entry.note.trim()}) : null,
            el('div', {class: 'print-foot'}, [
                el('span', {class: 'mono', text: `${entry.guideName} · ${entry.stepName} · ${entry.language}`}),
                el('span', {text: `enyo onboarding simulator · ${printedAt}`}),
            ]),
        ])));

        root.classList.add('measuring');
        await document.fonts.ready;
        await Promise.all(Array.from(root.querySelectorAll('img')).map(img => img.decode().catch(() => undefined)));
        root.querySelectorAll('.print-slot').forEach(slot => {
            const device = slot.firstElementChild;
            if (!device) return;
            const zoom = Math.min(1, slot.clientHeight / device.offsetHeight, slot.clientWidth / device.offsetWidth);
            if (zoom < 1) device.style.zoom = String(zoom);
        });
        root.classList.remove('measuring');

        // The browser offers the document title as the PDF's file name.
        const guides = new Set(state.basket.map(entry => entry.guideName));
        const title = document.title;
        document.title = [state.basket[0].packageName, guides.size === 1 ? [...guides][0] : null, 'onboarding']
            .filter(Boolean).join('-');
        window.addEventListener('afterprint', () => {
            document.title = title;
            root.replaceChildren();
        }, {once: true});
        window.print();
    };

    // ---- log --------------------------------------------------------------
    const appendLog = event => {
        const log = document.getElementById('log');
        const stamp = String(event.at ?? 0).padStart(5, ' ');
        const line = el('div', {
            class: event.kind + (event.level === 'error' ? ' error' : ''),
            text: `${stamp}ms ${event.kind === 'app' ? '[app]' : event.kind === 'sdk' ? '[sdk]' : '[sim]'} ${event.message}`,
        });
        const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
        log.appendChild(line);
        if (atBottom) log.scrollTop = log.scrollHeight;
    };

    // ---- boot -------------------------------------------------------------
    const loadApp = async () => {
        state.app = await api('/api/app');
        renderLibrary();
    };
    document.getElementById('language').value = state.language;
    document.getElementById('language').addEventListener('change', event => {
        state.language = event.target.value;
        try {
            localStorage.setItem('enyo.sim.lang', state.language);
        } catch {
            // not remembered, still switched
        }
        renderLibrary();
        rerender();
    });
    document.getElementById('reload').addEventListener('click', async () => {
        await api('/api/reload', {method: 'POST'});
        state.view = null;
        state.ui = null;
        document.getElementById('stage').replaceChildren(el('div', {class: 'empty', text: 'Reloaded. Pick a guide to start a run.'}));
        document.getElementById('inspector-body').replaceChildren(document.createTextNode('No run.'));
        await loadApp();
    });
    state.basket = loadBasket();
    renderBasket();
    new EventSource('/api/log').onmessage = event => appendLog(JSON.parse(event.data));
    loadApp().catch(error => {
        document.getElementById('stage').replaceChildren(el('div', {class: 'empty', text: error.message}));
    });
</script>
</body>
</html>
